apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: workload.rules
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting repeatedly"

        - alert: DeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"

        - alert: ContainerCPUThrottled
          expr: |
            sum by (namespace, pod) (rate(container_cpu_cfs_throttled_periods_total[5m]))
              / sum by (namespace, pod) (rate(container_cpu_cfs_periods_total[5m])) > 0.5
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is CPU throttled over 50%"

    - name: node.rules
      rules:
        - alert: NodeMemoryHigh
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Node {{ $labels.instance }} memory above 90%"

        - alert: NodeDiskFillingUp
          expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes) < 0.15
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "Disk on {{ $labels.instance }} has less than 15% free"
